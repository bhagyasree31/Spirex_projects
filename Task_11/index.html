
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather App</h1>

        <p class="subtitle">
            Search for a city to check the current weather
        </p>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>

        <p id="message"></p>

        <div id="weatherResult" class="weather-card">

            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

            <h2 id="cityName">City</h2>

            <h3 id="temperature">--°C</h3>

            <p id="condition">Weather Condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="weather.js"></script>

</body>
</html>
